name: build-apk
on:
  workflow_dispatch:
  push:

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "platforms;android-30" "build-tools;28.0.2" "build-tools;30.0.3" "ndk;21.0.6113669" "cmake;3.10.2.4988404"

      - name: Unpack project
        run: unzip -q CyberLauncher-BlackBox.zip

      - name: Build
        shell: bash
        working-directory: CyberLauncher
        run: |
          # the runner presets ANDROID_NDK_HOME to NDK 30, AGP 4.0.1 would use it
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.0.6113669
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee ../build.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberLauncher-debug
          path: CyberLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
