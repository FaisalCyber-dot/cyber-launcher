name: build-apk
on:
  workflow_dispatch:
  push:

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Blacks-BlackBox 4.7.1 needs AGP 8.13 / Gradle 8.13 -> JDK 17+, Bcore compiles with Java 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          # build-tools: AGP downloads the version it needs itself (licenses are accepted above)
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "ndk;29.0.13846066"

      - name: Unpack project
        run: |
          echo "files in the repo root:"; ls -la
          test -f CyberLauncher-BlackBox.zip || { echo "ERROR: upload CyberLauncher-BlackBox.zip to the repo root (next to .github/)"; exit 1; }
          # always start from a clean folder: an old unzipped CyberLauncher/ folder in the repo must not leak into the build
          rm -rf CyberLauncher
          unzip -q -o CyberLauncher-BlackBox.zip
          # sanity: this must be the BlackBox app project, not the old launcher
          test -f CyberLauncher/app/src/main/java/com/onebitmonochrome/blacksbbox/menu/MenuInjector.java || { echo "ERROR: wrong zip (MenuInjector.java missing)"; exit 1; }
          test ! -d CyberLauncher/app/src/main/java/com/cyber/launcher || { echo "ERROR: old launcher sources found in the zip"; exit 1; }

      - name: Patch project (64-bit only native build)
        run: |
          # the app is arm64-v8a only; skip armeabi-v7a natives of Bcore (harmless if already done in the zip)
          sed -i "s/abiFilters 'arm64-v8a' , 'armeabi-v7a'/abiFilters 'arm64-v8a'/" CyberLauncher/Bcore/build.gradle
          sed -i "s/^APP_ABI := .*/APP_ABI := arm64-v8a/" CyberLauncher/Bcore/src/main/cpp/Application.mk
          echo "== patched =="
          grep -n "abiFilters" CyberLauncher/Bcore/build.gradle CyberLauncher/app/build.gradle
          grep -n "APP_ABI" CyberLauncher/Bcore/src/main/cpp/Application.mk

      - name: Normalize file timestamps
        run: |
          # unzip reads a zip entry that has no UTC timestamp as local time of this runner (UTC).
          # Entries stamped on a phone/PC in UTC+5 then lie hours in the future. ninja sees
          # build.ninja as older than such an input forever:
          #   ninja: error: manifest 'build.ninja' still dirty after 100 tries
          echo "runner time (UTC): $(date -u '+%F %T')"
          echo "newest file before touch:"
          find CyberLauncher -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS  %p\n' | sort | tail -3
          find CyberLauncher -exec touch {} +
          echo "newest file after touch:"
          find CyberLauncher -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS  %p\n' | sort | tail -1

      - name: Build
        shell: bash
        working-directory: CyberLauncher
        run: |
          # the NDK version is pinned by ndkVersion in the Gradle files (29.0.13846066); drop the runner's presets
          unset ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME ANDROID_NDK
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug --stacktrace --no-daemon > ../build.log 2>&1
          rc=$?
          set -e
          echo "gradle exit code: $rc"
          grep -n -E "BUILD (SUCCESSFUL|FAILED)" ../build.log || true
          if [ "$rc" -ne 0 ]; then
            echo "== every unresolved dependency =="
            grep -E "Could not (find|resolve|GET|HEAD)" ../build.log | sed 's/^[[:space:]]*//' | sort -u | head -40 || true
            echo "== first errors =="
            grep -n -E "error:|What went wrong" -A12 ../build.log | head -100
          fi
          exit $rc

      - name: Report what was built
        if: always()
        shell: bash
        run: |
          echo "== NDK versions seen in log =="
          grep -o 'sdk/ndk/[0-9.]*' build.log | sort | uniq -c || true
          echo "== files under app/build/outputs =="
          find CyberLauncher/app/build/outputs -type f 2>/dev/null | head -50 || true
          echo "== APK check =="
          apk=CyberLauncher/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$apk" ]; then
            ls -l "$apk"
            aapt=$(ls -d $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
            $aapt dump badging "$apk" | grep -E "^package|sdkVersion|native-code" || true
            unzip -l "$apk" | grep -E "\.so$" | head -30 || true
          else
            echo "NO APK at $apk"
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberLauncher-debug
          path: CyberLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
